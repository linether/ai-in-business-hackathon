services:
  app:
    build: .
    restart: unless-stopped
    env_file: [.env]
    expose: ["8000"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Caddy needs SITE_DOMAIN too — the Caddyfile reads it as {$SITE_DOMAIN}.
    # Without it Caddy falls back to "localhost", issues itself a self-signed
    # certificate, and every visitor gets a TLS error.
    env_file: [.env]
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on: [app]

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
